name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Run tests
        run: cargo test

      - name: Build WASM
        run: wasm-pack build --target web --release

      - name: Copy WASM to extension
        run: |
          mkdir -p extension/wasm
          cp pkg/web_agent_ir.js extension/wasm/
          cp pkg/web_agent_ir_bg.wasm extension/wasm/

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/

  package-release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: extension
          path: extension/

      - name: Extract version from manifest
        id: version
        run: |
          VERSION=$(grep -oP '"version"\s*:\s*"\K[^"]+' extension/manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package extension
        run: |
          cd extension
          zip -r "../web-agent-v${{ steps.version.outputs.version }}.zip" . \
            -x "*.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Web Agent v${{ steps.version.outputs.version }}"
          body: |
            ## Web Agent Extension v${{ steps.version.outputs.version }}

            ### Installation
            1. Download `web-agent-v${{ steps.version.outputs.version }}.zip`
            2. Unzip to a folder
            3. Open `chrome://extensions`
            4. Enable "Developer mode"
            5. Click "Load unpacked" and select the unzipped folder

            ### Changes
            See [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.
          files: web-agent-v${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
