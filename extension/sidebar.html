<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; color: #1f2937; background: #f9fafb; min-width: 360px; display: flex; flex-direction: column; height: 100vh; }
    
    .tabs { display: flex; background: #fff; border-bottom: 1px solid #e5e7eb; flex-shrink: 0; }
    .tab { flex: 1; padding: 10px 4px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 500; color: #6b7280; border-bottom: 2px solid transparent; transition: all 0.15s; user-select: none; }
    .tab:hover { color: #2563eb; background: #f0f5ff; }
    .tab.active { color: #2563eb; border-bottom-color: #2563eb; }
    
    .panel { display: none; flex: 1; overflow-y: auto; padding: 12px; }
    .panel.active { display: flex; flex-direction: column; }
    
    .btn { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-warning { background: #f59e0b; color: #fff; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-sm { padding: 3px 8px; font-size: 11px; }
    .btn-block { width: 100%; }
    
    input, select, textarea { padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; font-family: inherit; width: 100%; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
    textarea { resize: vertical; }
    label { font-size: 12px; color: #374151; font-weight: 500; display: block; margin-bottom: 3px; }
    
    .field { margin-bottom: 10px; }
    .row { display: flex; align-items: center; gap: 6px; }
    .row > * { flex-shrink: 0; }
    .row input, .row select { flex: 1; }
    .gap-8 { gap: 8px; }
    .mb-8 { margin-bottom: 8px; }
    .mb-12 { margin-bottom: 12px; }
    .mt-8 { margin-top: 8px; }
    .mt-auto { margin-top: auto; }
    
    .task-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
    .task-card:hover { border-color: #93c5fd; }
    .task-card.selected { border-color: #2563eb; background: #eff6ff; }
    .task-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .task-meta { font-size: 11px; color: #6b7280; }
    .task-actions { display: flex; gap: 4px; margin-top: 6px; }
    
    .node-list { display: flex; flex-direction: column; gap: 6px; }
    .node-item { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; cursor: grab; transition: all 0.15s; }
    .node-item:active { cursor: grabbing; }
    .node-item.dragging { opacity: 0.4; border-style: dashed; }
    .node-item.drag-over { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
    .node-badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; color: #fff; white-space: nowrap; flex-shrink: 0; }
    .node-badge.navigate { background: #6366f1; }
    .node-badge.summarize { background: #8b5cf6; }
    .node-badge.action { background: #2563eb; }
    .node-badge.agent_loop { background: #0891b2; }
    .node-badge.export_data { background: #16a34a; }
    .node-badge.wait { background: #f59e0b; }
    .node-badge.log { background: #6b7280; }
    .node-info { flex: 1; min-width: 0; }
    .node-title { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-desc { font-size: 11px; color: #9ca3af; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .drag-handle { color: #d1d5db; cursor: grab; font-size: 16px; flex-shrink: 0; user-select: none; }
    
    .log-area { background: #1e1e1e; color: #d4d4d4; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 11px; overflow-y: auto; flex: 1; min-height: 100px; }
    .log-line { padding: 2px 0; border-bottom: 1px solid #2d2d2d; }
    .log-line.info { color: #d4d4d4; }
    .log-line.action { color: #60a5fa; }
    .log-line.result { color: #34d399; }
    .log-line.error { color: #f87171; }
    .log-line.warn { color: #fbbf24; }
    
    .progress-bar { height: 4px; background: #e5e7eb; border-radius: 2px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: #2563eb; transition: width 0.3s; width: 0; }
    
    .summary-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; padding: 8px 10px; margin-top: 8px; font-size: 12px; }
    .summary-box.error { background: #fef2f2; border-color: #fecaca; }
    .summary-row { display: flex; justify-content: space-between; padding: 2px 0; }
    .summary-label { color: #6b7280; }
    .summary-value { font-weight: 600; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: none; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 8px; padding: 20px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 16px; }
    
    .empty-state { text-align: center; padding: 30px 20px; color: #9ca3af; }
    .empty-state-icon { font-size: 32px; margin-bottom: 8px; }
    .empty-state-text { font-size: 13px; }
    
    .settings-section { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
    .settings-section-title { font-weight: 600; font-size: 13px; margin-bottom: 8px; color: #374151; }
    
    .toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .toolbar-title { font-weight: 600; font-size: 14px; flex: 1; }
    
    .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
    .status-dot.running { background: #2563eb; animation: pulse 1s infinite; }
    .status-dot.success { background: #16a34a; }
    .status-dot.error { background: #dc2626; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-tab="tasks">任务列表</div>
    <div class="tab" data-tab="editor">流程编辑</div>
    <div class="tab" data-tab="run">运行</div>
    <div class="tab" data-tab="settings">设置</div>
  </div>

  <div class="panel active" id="panel-tasks">
    <div class="toolbar">
      <span class="toolbar-title">任务</span>
      <button class="btn btn-primary btn-sm" id="btn-new-task">+ 新建</button>
      <button class="btn btn-secondary btn-sm" id="btn-import-task">导入</button>
    </div>
    <div id="task-list"></div>
  </div>

  <div class="panel" id="panel-editor">
    <div class="toolbar">
      <span class="toolbar-title" id="editor-title">选择任务</span>
      <button class="btn btn-secondary btn-sm" id="btn-add-node">+ 节点</button>
      <button class="btn btn-primary btn-sm" id="btn-save-flow">保存</button>
    </div>
    <div class="field">
      <label>任务名称</label>
      <input id="flow-name" type="text" placeholder="输入任务名称...">
    </div>
    <div class="field">
      <label>重复次数</label>
      <input id="flow-repeat" type="number" value="1" min="1" style="width:80px">
    </div>
    <div id="node-list" class="node-list"></div>
    <div id="node-empty" class="empty-state" style="display:none">
      <div class="empty-state-icon">⚡</div>
      <div class="empty-state-text">点击上方「+ 节点」添加功能节点</div>
    </div>
  </div>

  <div class="panel" id="panel-run">
    <div class="toolbar">
      <span class="toolbar-title" id="run-title">运行</span>
      <button class="btn btn-success btn-sm" id="btn-start-run">▶ 开始</button>
      <button class="btn btn-danger btn-sm" id="btn-stop-run" disabled>■ 停止</button>
    </div>
    <div class="field" style="display:flex;align-items:center;gap:8px;">
      <label style="margin:0;white-space:nowrap;">执行任务:</label>
      <select id="run-task-select"></select>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="run-progress"></div></div>
    <div id="run-log" class="log-area">等待运行...</div>
    <div id="run-summary" style="display:none;"></div>
  </div>

  <div class="panel" id="panel-settings">
    <div class="settings-section">
      <div class="settings-section-title">API 配置</div>
      <div class="field">
        <label>API Base URL</label>
        <input id="set-api-base" type="text" placeholder="https://api.openai.com/v1">
      </div>
      <div class="field">
        <label>API Key</label>
        <input id="set-api-key" type="password" placeholder="sk-...">
      </div>
      <div class="field">
        <label>Model</label>
        <input id="set-api-model" type="text" placeholder="gpt-4o">
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">执行配置</div>
      <div class="field">
        <label>Token 模式</label>
        <select id="set-mode">
          <option value="normal">Normal</option>
          <option value="ultra">Ultra</option>
        </select>
      </div>
      <div class="field">
        <label>Agent 最大步数</label>
        <input id="set-max-steps" type="number" value="10" min="1" max="100">
      </div>
      <div class="field">
        <label>Token 预算 (留空无限制)</label>
        <input id="set-budget" type="number" placeholder="无限制" min="100">
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">数据管理</div>
      <div class="row gap-8">
        <button class="btn btn-secondary" id="btn-export-all">导出所有任务</button>
        <button class="btn btn-secondary" id="btn-import-all">导入任务</button>
        <button class="btn btn-danger" id="btn-clear-all">清空数据</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block mt-8" id="btn-save-settings">保存设置</button>
    <div id="settings-status" style="text-align:center;font-size:12px;color:#16a34a;margin-top:6px;"></div>
  </div>

  <div class="modal-overlay" id="modal-node">
    <div class="modal">
      <div class="modal-title" id="modal-node-title">添加节点</div>
      <div class="field">
        <label>节点类型</label>
        <select id="node-type">
          <option value="navigate">🌐 导航 (navigate)</option>
          <option value="summarize">📝 总结 (summarize)</option>
          <option value="action">🖱 操作 (action)</option>
          <option value="agent_loop">🤖 Agent循环 (agent_loop)</option>
          <option value="export_data">📦 导出数据 (export_data)</option>
          <option value="wait">⏱ 等待 (wait)</option>
          <option value="log">📋 日志 (log)</option>
        </select>
      </div>
      <div id="node-params"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btn-modal-cancel">取消</button>
        <button class="btn btn-primary" id="btn-modal-confirm">确定</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-task-name">
    <div class="modal">
      <div class="modal-title">新建任务</div>
      <div class="field">
        <label>任务名称</label>
        <input id="new-task-name" type="text" placeholder="输入任务名称...">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btn-tn-cancel">取消</button>
        <button class="btn btn-primary" id="btn-tn-confirm">创建</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-import" accept=".json" style="display:none">

  <script src="sidebar.js" type="module"></script>
</body>
</html>
